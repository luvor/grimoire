<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="50%" style="stop-color:#14141f"/>
      <stop offset="100%" style="stop-color:#0d0c11"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574"/>
      <stop offset="100%" style="stop-color:#8b7355"/>
    </linearGradient>
    <radialGradient id="appleGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#d4a574;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="cellGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#8b5e3c;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#8b5e3c;stop-opacity:0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>

  <!-- Subtle radial field lights -->
  <circle cx="360" cy="340" r="340" fill="url(#appleGlow)"/>
  <circle cx="840" cy="340" r="340" fill="url(#cellGlow)"/>

  <!-- Faint vertical divider: the "fault line" -->
  <g opacity="0.25" stroke="#d4a574" stroke-width="0.6" stroke-dasharray="2 6">
    <line x1="600" y1="60" x2="600" y2="640"/>
  </g>

  <!-- Faint concentric ritual circles (left side, around apple) -->
  <g stroke="url(#goldGrad)" fill="none" opacity="0.12">
    <circle cx="360" cy="340" r="200"/>
    <circle cx="360" cy="340" r="240"/>
    <circle cx="360" cy="340" r="280"/>
  </g>

  <!-- Faint concentric lines (right side, around cell) -->
  <g stroke="url(#goldGrad)" fill="none" opacity="0.12">
    <circle cx="840" cy="340" r="200"/>
    <circle cx="840" cy="340" r="240"/>
    <circle cx="840" cy="340" r="280"/>
  </g>

  <!-- LEFT: Apple (cross-section style) -->
  <g filter="url(#glow)">
    <!-- Apple outline -->
    <path d="M 360,200
             C 290,200 250,260 250,330
             C 250,410 295,480 360,480
             C 425,480 470,410 470,330
             C 470,260 430,200 360,200 Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <!-- Stem -->
    <path d="M 360,200 Q 370,170 385,155" fill="none" stroke="#d4a574" stroke-width="2"/>
    <!-- Leaf -->
    <path d="M 385,155 Q 410,145 420,165 Q 405,170 385,155 Z"
          fill="#d4a574" opacity="0.4"/>
    <!-- Core (pentagram of seeds — classic apple cross-section) -->
    <g transform="translate(360,340)" stroke="#d4a574" stroke-width="1" fill="none" opacity="0.55">
      <path d="M 0,-55 L 14,-17 L 52,-17 L 22,8 L 33,46 L 0,22 L -33,46 L -22,8 L -52,-17 L -14,-17 Z"/>
    </g>
    <!-- Seeds (5, at pentagram vertices) -->
    <g fill="#d4a574" opacity="0.85">
      <ellipse cx="360" cy="285" rx="6" ry="10" transform="rotate(0 360 285)"/>
      <ellipse cx="412" cy="323" rx="6" ry="10" transform="rotate(72 412 323)"/>
      <ellipse cx="393" cy="386" rx="6" ry="10" transform="rotate(144 393 386)"/>
      <ellipse cx="327" cy="386" rx="6" ry="10" transform="rotate(216 327 386)"/>
      <ellipse cx="308" cy="323" rx="6" ry="10" transform="rotate(288 308 323)"/>
    </g>
  </g>

  <!-- Hebrew-ish tag above apple -->
  <text x="360" y="160" font-family="'Noto Serif JP', serif" font-size="20" fill="#d4a574" opacity="0.55" text-anchor="middle">בְּרֵאשִׁית</text>

  <!-- RIGHT: Cell (schematic cross-section) -->
  <g filter="url(#glow)">
    <!-- Cell membrane -->
    <circle cx="840" cy="340" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <!-- Nucleus -->
    <circle cx="835" cy="335" r="50" fill="none" stroke="#d4a574" stroke-width="1.5" opacity="0.85"/>
    <!-- Nucleus inner chromatin dots -->
    <g fill="#d4a574" opacity="0.6">
      <circle cx="820" cy="325" r="3"/>
      <circle cx="850" cy="332" r="2.5"/>
      <circle cx="840" cy="350" r="3"/>
      <circle cx="825" cy="345" r="2"/>
    </g>
    <!-- Organelles (mitochondria) -->
    <g fill="none" stroke="#d4a574" stroke-width="1" opacity="0.55">
      <ellipse cx="780" cy="290" rx="14" ry="7" transform="rotate(-25 780 290)"/>
      <ellipse cx="895" cy="295" rx="12" ry="6" transform="rotate(35 895 295)"/>
      <ellipse cx="790" cy="400" rx="14" ry="7" transform="rotate(20 790 400)"/>
      <ellipse cx="895" cy="395" rx="12" ry="6" transform="rotate(-30 895 395)"/>
    </g>
    <!-- ER-ish wavy line -->
    <path d="M 760,370 Q 800,355 820,375 Q 840,395 870,375"
          fill="none" stroke="#d4a574" stroke-width="1" opacity="0.4"/>
    <!-- Dividing spindle indicator (the moment of asymmetry) -->
    <g stroke="#d4a574" stroke-width="0.8" opacity="0.5" fill="none">
      <line x1="770" y1="335" x2="905" y2="335" stroke-dasharray="3 4"/>
    </g>
  </g>

  <!-- Scientific tag below cell -->
  <text x="840" y="525" font-family="'JetBrains Mono', monospace" font-size="12" fill="#d4a574" opacity="0.55" text-anchor="middle" letter-spacing="3">ANISOGAMY · 10⁹ YA</text>

  <!-- Left: biblical/poetic tag -->
  <text x="360" y="525" font-family="'Cormorant Garamond', serif" font-style="italic" font-size="16" fill="#d4a574" opacity="0.6" text-anchor="middle">Genesis 3:7</text>

  <!-- Connecting arc (the metaphorical bridge) -->
  <path d="M 460,340 Q 600,290 740,340"
        fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.45"
        stroke-dasharray="1 5"/>
  <!-- Bridge endpoints -->
  <circle cx="460" cy="340" r="3" fill="#d4a574" opacity="0.8"/>
  <circle cx="740" cy="340" r="3" fill="#d4a574" opacity="0.8"/>

  <!-- Serpent (thin, curled around the composition loosely) -->
  <g opacity="0.35" fill="none" stroke="#d4a574" stroke-width="1.5" stroke-linecap="round">
    <path d="M 200,550 Q 300,570 400,540 Q 500,510 600,540 Q 700,570 800,540 Q 900,510 1000,550"/>
    <!-- Serpent head hint -->
    <path d="M 1000,550 Q 1012,548 1018,553 Q 1012,558 1000,556 Z" fill="#d4a574"/>
  </g>

  <!-- Double helix rising from bottom center -->
  <g opacity="0.3" stroke="#d4a574" stroke-width="1" fill="none">
    <path d="M 560,690 Q 600,670 640,690 Q 600,650 560,630 Q 600,610 640,630 Q 600,590 560,570"/>
    <path d="M 640,690 Q 600,670 560,690 Q 600,650 640,630 Q 560,650 600,630 Q 560,610 640,590"/>
    <!-- rungs -->
    <g stroke-width="0.6" opacity="0.6">
      <line x1="568" y1="680" x2="632" y2="680"/>
      <line x1="570" y1="660" x2="630" y2="660"/>
      <line x1="568" y1="640" x2="632" y2="640"/>
      <line x1="572" y1="620" x2="628" y2="620"/>
      <line x1="570" y1="600" x2="630" y2="600"/>
    </g>
  </g>

  <!-- Scattered dots / stars / points of cognitive spark -->
  <g fill="#d4a574" opacity="0.55">
    <circle cx="120" cy="100" r="1"/>
    <circle cx="1080" cy="80" r="1.2"/>
    <circle cx="180" cy="240" r="0.8"/>
    <circle cx="1040" cy="260" r="0.8"/>
    <circle cx="80" cy="440" r="1"/>
    <circle cx="1130" cy="420" r="1"/>
    <circle cx="140" cy="600" r="0.8"/>
    <circle cx="1070" cy="610" r="0.8"/>
    <circle cx="220" cy="130" r="0.6"/>
    <circle cx="980" cy="170" r="0.6"/>
  </g>

  <!-- Upper decorative frame lines -->
  <g opacity="0.25" stroke="#d4a574" stroke-width="0.5" fill="none">
    <line x1="60" y1="60" x2="160" y2="60"/>
    <line x1="60" y1="60" x2="60" y2="160"/>
    <line x1="1140" y1="60" x2="1040" y2="60"/>
    <line x1="1140" y1="60" x2="1140" y2="160"/>
    <line x1="60" y1="640" x2="160" y2="640"/>
    <line x1="60" y1="640" x2="60" y2="540"/>
    <line x1="1140" y1="640" x2="1040" y2="640"/>
    <line x1="1140" y1="640" x2="1140" y2="540"/>
  </g>
</svg>
